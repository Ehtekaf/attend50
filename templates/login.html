{% extends "layout.html" %}

{% block title %}Log In{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold">Sign In</h3>
                <form action="/login" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Username" type="text" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" id="password" name="password" placeholder="Password" type="password" required>
                    </div>
                    <button class="btn btn-primary w-100 py-2 mt-2" type="submit">Log In</button>
                </form>
                <div class="text-center mt-3 small">
                    Don't have an account? <a href="/register">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
