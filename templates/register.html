{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold">Create Account</h3>
                <form action="/register" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Choose a username" type="text" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" id="password" name="password" placeholder="Password" type="password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirmation">Confirm Password</label>
                        <input class="form-control" id="confirmation" name="confirmation" placeholder="Confirm password" type="password" required>
                    </div>
                    <button class="btn btn-success w-100 py-2 mt-2" type="submit">Register</button>
                </form>
                <div class="text-center mt-3 small">
                    Already registered? <a href="/login">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
